name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, curl, zip, gd, dom, mbstring
      - name: Lint
        run: for f in app/*.php bin/*.php public/index.php tests/*.php; do php -l "$f" || exit 1; done
      - name: Tests
        run: php tests/run.php
